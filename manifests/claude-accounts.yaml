apiVersion: lealing.dev/v1
id: claude-accounts
version: 1.1.0
name: Contas do Claude Code
summary: Guarde sessões de várias contas do Claude Code e alterne explicitamente entre elas.
detail: Mantém o índice no diretório privado da tool e troca o par de credencial e identidade usado pela CLI do Claude Code.
category: ai
risk: caution
glyph: ⇆
keywords: [claude, conta, login, sessão, perfil, credencial]
runtime: {kind: process, protocol: {min: 1, max: 1}, executable: lealing-tool-claude-accounts}
ui: {mode: screen-v1}
platforms: [darwin-amd64, darwin-arm64, windows-amd64, windows-arm64]
requirements: []
permissions:
  filesystem:
    read: [~/.claude/.credentials.json, ~/.claude.json]
    write: [~/.claude/.credentials.json, ~/.claude.json]
  network: false
  subprocess: true
