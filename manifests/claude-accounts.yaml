apiVersion: lealing.dev/v1
id: claude-accounts
version: 1.3.3
name: Contas do Claude Code
summary: Guarde várias contas do Claude Code inteiras e alterne explicitamente entre elas.
detail: Cada perfil guarda a conta completa — credencial, identidade, cotas e o settings.json inteiro, com endpoint, modelos e variáveis. Histórico, planos e tarefas ficam de fora e continuam de onde pararam.
category: ai
risk: caution
glyph: ⇆
keywords: [claude, conta, login, sessão, perfil, credencial, token, api-key]
runtime: {kind: process, protocol: {min: 1, max: 1}, executable: lealing-tool-claude-accounts}
ui: {mode: screen-v1}
platforms: [darwin-amd64, darwin-arm64, windows-amd64, windows-arm64]
requirements: []
permissions:
  filesystem:
    read: [~/.claude/.credentials.json, ~/.claude/settings.json, ~/.claude.json]
    write: [~/.claude/.credentials.json, ~/.claude/settings.json, ~/.claude.json]
  network: false
  subprocess: true
