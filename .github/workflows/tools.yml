name: official-tools

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Nova versão conjunta (vX.Y.Z)"
        required: true
        default: "v1.3.0"
        type: string

permissions:
  contents: read

jobs:
  tools:
    uses: mateuslh/lealing-sdk/.github/workflows/publish-tools.yml@v0.1.0
    permissions:
      contents: write
    with:
      tools: "token-usage system-info power-control claude-accounts http-probe network-inspector json-lab jwt-inspector cidr-calculator codec-lab checksum-lab uuid-generator"
      devkit-tools: "http-probe network-inspector json-lab jwt-inspector cidr-calculator codec-lab checksum-lab uuid-generator"
      channel: official
      publish-index: true
      default-version: "v1.3.0"
      sdk-version: v0.1.0
      version: ${{ inputs.version }}
